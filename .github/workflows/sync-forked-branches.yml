name: Sync forked branches

# Keeps forked-stable/forked-nightly (which point the installer/updater at
# Tullysaurus/modmium instead of crosmium/modmium, for testing this fork on
# real hardware) up to date with stable/nightly. Each fork branch carries
# only a small diff on top of its upstream counterpart, so a clean merge is
# the expected outcome; a real conflict means someone touched the same
# lines the fork overrides, which needs a human to resolve.
#
# NOTE: both the `push` and `schedule` triggers only fire from a workflow
# file that already exists on the branch being pushed to / on the
# repository's default branch (stable) respectively. Until this file is
# merged there (via nightly, per this repo's normal promotion flow), it can
# still be run on demand from the Actions tab (workflow_dispatch) from
# whichever branch it lives on.

on:
  push:
    branches: [stable, nightly]
  schedule:
    - cron: "0 3 * * *" # daily safety net, in case a push-triggered run is ever missed
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - upstream: stable
            fork: forked-stable
          - upstream: nightly
            fork: forked-nightly
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.fork }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge ${{ matrix.upstream }} into ${{ matrix.fork }}
        run: |
          git fetch origin "${{ matrix.upstream }}"
          if git merge --no-edit "origin/${{ matrix.upstream }}"; then
            if git diff --quiet "HEAD@{1}" HEAD; then
              echo "Already up to date, nothing to push."
            else
              git push origin "HEAD:${{ matrix.fork }}"
            fi
          else
            git merge --abort
            echo "::error::Merging ${{ matrix.upstream }} into ${{ matrix.fork }} produced a real conflict (not just the fork's own diff). Resolve it manually: git checkout ${{ matrix.fork }} && git merge origin/${{ matrix.upstream }}, fix the conflict, commit, and push."
            exit 1
          fi
